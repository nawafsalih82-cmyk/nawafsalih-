name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q Nawaf_Past_Simple_Quiz_Android_Project.zip -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found"
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Fix audio resources
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/raw"

          if [ -d "$PROJECT_DIR/app/src/main/res/drawable" ]; then
            find "$PROJECT_DIR/app/src/main/res/drawable" \
              -maxdepth 1 \
              -type f \
              -iname "*.wav" \
              -exec mv {} "$PROJECT_DIR/app/src/main/res/raw/" \;
          fi

          echo "Audio resources fixed."

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Copy APK
        run: |
          mkdir -p output

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          cp "$APK" output/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: output/app-debug.apk
          if-no-files-found: error
