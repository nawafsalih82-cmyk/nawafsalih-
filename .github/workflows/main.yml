name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V4
        run: |
          rm -rf project
          mkdir project
          unzip -q Nawaf_Quiz_V4-3.zip -d project

      - name: Find project
        run: |
          PROJECT=$(find project -name gradlew -type f -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Android project not found"
            exit 1
          fi
          DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/app-debug.apk output/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: output/app-debug.apk
